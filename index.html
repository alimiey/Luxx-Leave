<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LUXX Leave</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--ink:#17212b;--mut:#66727f;--line:#dde3e9;--acc:#0e6b66;--acc-t:#fff;--soft:#e3f1f0;--warn:#fff3d6;--warn-i:#7a5600;--bad:#fde7e5;--bad-i:#a02a21;--ok:#e1f4e6;--ok-i:#1d6b34}
@media(prefers-color-scheme:dark){:root{--bg:#10161c;--card:#19212a;--ink:#e8edf2;--mut:#93a0ad;--line:#2b3641;--acc:#3fb8b0;--acc-t:#062624;--soft:#173331;--warn:#3a2e10;--warn-i:#f1c96a;--bad:#3b1d1b;--bad-i:#f2a39c;--ok:#16301f;--ok-i:#8fd9a5}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:720px;margin:0 auto;padding:0 14px 40px}
h1{font-size:22px;margin:16px 0 8px}h2{font-size:16px;margin:20px 0 8px}
.tabs{display:flex;gap:16px;border-bottom:1px solid var(--line);margin:10px 0 12px;overflow-x:auto;white-space:nowrap}
.tabs button{border:0;background:none;color:var(--mut);padding:8px 0;font:inherit;font-weight:600;cursor:pointer;border-bottom:2px solid transparent}
.tabs button.on{color:var(--acc);border-color:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bal b{font-size:22px}.bal span{color:var(--mut);font-size:13px;display:block}
.bal i{display:block;height:5px;background:var(--line);border-radius:3px;margin-top:6px}.bal i u{display:block;height:100%;background:var(--acc);border-radius:3px}
.row{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.mut{color:var(--mut);font-size:13px}
.tag{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;font-weight:600;background:var(--soft);color:var(--acc);white-space:nowrap}
.tag.hr{background:var(--warn);color:var(--warn-i)}.tag.approved{background:var(--ok);color:var(--ok-i)}.tag.rejected{background:var(--bad);color:var(--bad-i)}
label{display:block;font-weight:600;font-size:13px;margin:10px 0 3px}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
.btn{border:0;background:var(--acc);color:var(--acc-t);padding:10px 14px;border-radius:8px;font:inherit;font-weight:700;cursor:pointer;margin-top:10px}
.btn.ghost{background:var(--line);color:var(--ink);margin:0}.btn:disabled{opacity:.45;cursor:not-allowed}
.note{padding:8px 10px;border-radius:8px;font-size:13px;margin-top:8px}
.note.w{background:var(--warn);color:var(--warn-i)}.note.e{background:var(--bad);color:var(--bad-i)}.note.o{background:var(--ok);color:var(--ok-i)}
.empty{text-align:center;color:var(--mut);padding:22px 0}
a{color:var(--acc)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
</style>
</head>
<body>
<main><div id="app"><div class="empty">Memuatkan...</div></div></main>
<div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const SB = supabase.createClient('https://sbdcjehrldfsmsbetaab.supabase.co', 'sb_publishable_9FB90rfbg6Kf-SgVFqlGJw_PsLrGCgh');
const T = {AL:'Annual Leave', MC:'Medical Leave', EL:'Emergency Leave', UP:'Unpaid Leave'};
const ST = {hr:'Menunggu HR', boss:'Menunggu Lady Boss', approved:'Diluluskan', rejected:'Ditolak'};
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today = () => new Date().toLocaleDateString('en-CA', {timeZone:'Asia/Kuala_Lumpur'});
const fmt = s => s.split('-').reverse().join('/');
const addDay = (s, n) => { const d = new Date(s + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
const isWork = s => S.cal[s] ? S.cal[s] === 'op' : new Date(s + 'T00:00:00Z').getUTCDay() !== 5;
const cnt = (a, b) => { let n = 0; for (let d = a; d <= b; d = addDay(d, 1)) if (isWork(d)) n++; return n; };
let S = {scr:'in', mode:'in', msg:'', p:null, bal:[], reqs:[], cal:{}, tab:'a', cmsg:'', cm:today().slice(0, 7), day:null, cn:{}};
let setPw = /type=(invite|recovery)/.test(location.hash);

function toast(t) { const e = $('toast'); e.textContent = t; e.className = 'on'; clearTimeout(toast.t); toast.t = setTimeout(() => e.className = '', 2800); }
function go(m) { S.mode = m; S.msg = ''; render(); }

SB.auth.onAuthStateChange((ev) => { if (ev === 'PASSWORD_RECOVERY' || (setPw && ev === 'SIGNED_IN')) { S.scr = 'setpw'; render(); } });
(async () => {
  const { data: { session } } = await SB.auth.getSession();
  if (session && !setPw) await load(); else render();
})();

async function load() {
  const { data: { user } } = await SB.auth.getUser();
  const { data: p } = await SB.from('profiles').select('*').eq('id', user.id).single();
  if (!p || !p.active) { await SB.auth.signOut(); S.scr = 'in'; S.msg = 'Akaun tidak aktif atau profil tiada. Hubungi HR.'; return render(); }
  S.p = p;
  const [b, r, c] = await Promise.all([
    SB.from('v_balances').select('*').eq('user_id', p.id).eq('year', +today().slice(0, 4)),
    SB.from('leave_requests').select('*').eq('user_id', p.id).order('created_at', {ascending:false}),
    SB.from('calendar_days').select('*')]);
  S.bal = b.data || []; S.reqs = r.data || []; S.cal = {};
  S.cn = {}; (c.data || []).forEach(x => { S.cal[x.day] = x.status; S.cn[x.day] = x.note; });
  if (['hr', 'boss', 'acc'].includes(p.role)) {
    const y = +today().slice(0, 4);
    const [a, q, l, v, au] = await Promise.all([SB.from('profiles').select('*').order('employee_id'), SB.from('leave_requests').select('*').order('created_at', {ascending:false}), SB.from('leave_allocations').select('*'), SB.from('v_balances').select('*').eq('year', y), SB.from('audit_log').select('*').order('at', {ascending:false}).limit(100)]);
    S.all = {pf:a.data || [], rq:q.data || [], al:l.data || [], bal:v.data || [], au:au.data || []};
  }
  if (!S.view) { S.view = p.role === 'staf' ? 'me' : 'w'; S.tab = p.role === 'hr' ? 'i' : p.role === 'boss' ? 'k' : p.role === 'acc' ? 'b' : 'a'; }
  S.scr = 'app'; render();
}

async function doLogin() {
  const id = $('li').value.trim().toUpperCase(), pw = $('lp') ? $('lp').value : '';
  if (!id) { S.msg = 'Masukkan Employee ID.'; return render(); }
  const { data: email } = await SB.rpc('email_for_employee', {p_eid: id});
  if (S.mode === 'forgot') {
    if (email) await SB.auth.resetPasswordForEmail(email, {redirectTo: location.origin + location.pathname});
    toast('Jika ID wujud, pautan reset dihantar ke e-mel berdaftar'); return go('in');
  }
  if (!email || !pw) { S.msg = 'Employee ID atau kata laluan tidak betul.'; return render(); }
  const { error } = await SB.auth.signInWithPassword({email, password: pw});
  if (error) { S.msg = /confirm/i.test(error.message) ? 'E-mel akaun belum disahkan. Hubungi HR.' : 'Employee ID atau kata laluan tidak betul.'; return render(); }
  await load();
}
async function savePw() {
  const p1 = $('np').value;
  if (p1.length < 8) { S.msg = 'Kata laluan minimum 8 aksara.'; return render(); }
  const { error } = await SB.auth.updateUser({password: p1});
  if (error) { S.msg = error.message; return render(); }
  setPw = false; history.replaceState(null, '', location.pathname); toast('Kata laluan disimpan'); await load();
}
async function logout() { await SB.auth.signOut(); S.scr = 'in'; S.mode = 'in'; S.view = null; S.sel = null; render(); }

function loginView() {
  const m = S.mode;
  return `<h1>LUXX Leave</h1><div class="card"><h2 style="margin-top:0">${m === 'in' ? 'Log masuk' : 'Lupa kata laluan'}</h2>
  <label>Employee ID</label><input id="li" autocapitalize="characters" autocomplete="username">
  ${m === 'in' ? '<label>Kata laluan</label><input id="lp" type="password" autocomplete="current-password">' : ''}
  ${S.msg ? `<div class="note e">${esc(S.msg)}</div>` : ''}
  <button class="btn" onclick="doLogin()">${m === 'in' ? 'Log masuk' : 'Hantar pautan reset'}</button>
  <div style="margin-top:12px"><a href="#" onclick="go('${m === 'in' ? 'forgot' : 'in'}');return false">${m === 'in' ? 'Lupa kata laluan' : 'Kembali'}</a></div></div>
  <div class="mut">Akaun baharu: ikut pautan aktivasi dalam e-mel yang dihantar HR.</div>`;
}
function setPwView() {
  return `<h1>LUXX Leave</h1><div class="card"><h2 style="margin-top:0">Tetapkan kata laluan</h2><label>Kata laluan baharu (minimum 8 aksara)</label><input id="np" type="password" autocomplete="new-password">${S.msg ? `<div class="note e">${esc(S.msg)}</div>` : ''}<button class="btn" onclick="savePw()">Simpan</button></div>`;
}

const tag = s => `<span class="tag ${s}">${ST[s]}</span>`;
function reqCard(r) {
  return `<div class="card"><div class="row"><div>${r.ltype} · ${fmt(r.start_date)} – ${fmt(r.end_date)} · <b>${r.days} hari</b></div>${tag(r.status)}</div><div class="mut">${esc(r.reason)}${r.attachment_path ? ' · Lampiran: ada' : ''}</div>${r.reject_reason ? `<div class="note e">Sebab ditolak: ${esc(r.reject_reason)}</div>` : ''}</div>`;
}
function staffView() {
  const p = S.p, tb = (t, l) => `<button class="${S.tab === t ? 'on' : ''}" onclick="S.tab='${t}';render()">${l}</button>`;
  const head = `<div class="row" style="align-items:center;margin:14px 0 0"><div><b>${esc(p.full_name)}</b><div class="mut">${esc(p.employee_id)}</div></div><button class="btn ghost" onclick="logout()">Log keluar</button></div>
  <div class="tabs">${tb('a', 'Dashboard')}${p.role === 'boss' ? '' : tb('m', 'Mohon cuti') + tb('h', 'Sejarah') + tb('t', 'Takwim')}</div>`;
  if (p.role === 'boss') return head + '<div class="card">Skrin kelulusan Lady Boss akan ditambah dalam Bahagian 2.</div>';
  const note = p.role !== 'staf' ? '<button class="btn ghost" onclick="S.view=\'w\';S.tab=\'' + (p.role === 'hr' ? 'i' : 'b') + '\';render()">Kembali ke menu ' + (p.role === 'hr' ? 'HR' : 'Semakan') + '</button>' : '';
  if (S.tab === 't') return head + note + takwimView();
  if (S.tab === 'a') {
    const bm = Object.fromEntries(S.bal.map(b => [b.ltype, b]));
    const cards = Object.keys(T).map(k => { const b = bm[k], tot = b ? +b.base + +b.bf + +b.award + +b.swap : 0, bl = b ? +b.balance : 0;
      return `<div class="card bal"><span>${T[k]}</span><b>${k} ${bl}/${tot}</b><i><u style="width:${tot ? Math.max(0, bl / tot * 100) : 0}%"></u></i></div>`; }).join('');
    const al = bm.AL, brk = al ? `<div class="mut">AL: asas ${al.base} + B/F ${al.bf} + anugerah ${al.award} + ganti ${al.swap} − guna ${al.used}</div>` : '<div class="note w">Entitlement tahun ini belum diisi. Hubungi HR.</div>';
    const ap = S.reqs.filter(r => r.status === 'approved' && r.end_date >= today());
    return head + note + `<div class="grid">${cards}</div>${brk}<h2>Cuti diluluskan akan datang</h2>` + (ap.length ? ap.map(reqCard).join('') : '<div class="empty">Tiada cuti diluluskan akan datang.</div>');
  }
  if (S.tab === 'm') return head + `<div class="card"><label>Jenis cuti</label><select id="ft" onchange="calc()">${Object.keys(T).map(k => `<option value="${k}">${k} – ${T[k]}</option>`).join('')}</select>
  <label>Tarikh mula</label><input type="date" id="fs" onchange="calc()"><label>Tarikh tamat</label><input type="date" id="fe" onchange="calc()">
  <label>Sebab</label><textarea id="fw" rows="2" oninput="calc()"></textarea>
  <label id="fl">Lampiran sokongan (pilihan)</label><input type="file" id="ff" accept=".pdf,.jpg,.jpeg,.png" onchange="calc()">
  <div id="prev"></div><button class="btn" id="sub" onclick="submitReq()" disabled>Hantar permohonan</button></div>
  <div class="mut">Hari kerja ikut <a href="#" onclick="S.tab='t';render();return false">takwim kilang</a>. Notis AL 5 hari bekerja. MC dan EL boleh dimohon sehingga 7 hari ke belakang. Lampiran PDF/JPG/PNG, maksimum 5MB.</div>`;
  return head + (S.reqs.length ? S.reqs.map(reqCard).join('') : '<div class="empty">Tiada permohonan lagi.</div>');
}

/* ===== Bahagian 2: HR, Lady Boss, Akaun/Admin ===== */
const nm = id => (S.all.pf.find(x => x.id === id) || {}).full_name || '?';
const balOf = (u, k) => +(S.all.bal.find(b => b.user_id === u && b.ltype === k) || {balance:0}).balance;
const tot = b => b ? +b.base + +b.bf + +b.award + +b.swap : 0;
function appView() { const p = S.p; return (p.role === 'boss' || (p.role !== 'staf' && S.view !== 'me')) ? workView() : staffView(); }
function workView() {
  const p = S.p, tb = (t, l) => `<button class="${S.tab === t ? 'on' : ''}" onclick="S.tab='${t}';S.sel=null;render()">${l}</button>`;
  const top = `<div class="row" style="align-items:center;margin:14px 0 0"><div><b>${esc(p.full_name)}</b><div class="mut">${esc(p.employee_id)} · ${p.role === 'hr' ? 'HR' : p.role === 'boss' ? 'Lady Boss' : 'Akaun/Admin'}</div></div><button class="btn ghost" onclick="logout()">Log keluar</button></div>` + (p.role !== 'boss' ? `<button class="btn ghost" style="margin-top:8px" onclick="S.view='me';S.tab='a';render()">Cuti saya</button>` : '');
  const tabs = p.role === 'hr' ? tb('i', 'Peti masuk') + tb('b', 'Baki pasukan') + tb('t', 'Takwim') + tb('u', 'Audit') : p.role === 'acc' ? tb('b', 'Baki pasukan') + tb('r', 'Permohonan') + tb('t', 'Takwim') + tb('u', 'Audit') : tb('k', 'Kelulusan') + tb('t', 'Takwim') + tb('u', 'Audit');
  return top + `<div class="tabs">${tabs}</div>` + (S.tab === 'b' ? teamView() : S.tab === 't' ? takwimView() : S.tab === 'u' ? auditView() : S.tab === 'r' ? '<div class="mut">Baca sahaja.</div>' + S.all.rq.map(r => wreq(r)).join('') : S.tab === 'i' ? hrInbox() : bossView());
}
const spl = r => S.all.al.filter(a => a.request_id === r.id).map(a => a.days + ' ' + a.ltype).join(' + ');
function wreq(r, x = '') {
  const sp = spl(r);
  return `<div class="card"><div class="row"><div><b>${esc(nm(r.user_id))}</b><br>${r.ltype} · ${fmt(r.start_date)} – ${fmt(r.end_date)} · <b>${r.days} hari</b></div>${tag(r.status)}</div><div class="mut">${esc(r.reason)}${sp ? ' · Pecahan: ' + sp : ''}</div>${r.attachment_path && S.p.role !== 'acc' ? `<button class="btn ghost" style="margin-top:8px" data-p="${esc(r.attachment_path)}" onclick="openAtt(this.dataset.p)">Buka lampiran</button>` : ''}${r.reject_reason ? `<div class="note e">Sebab ditolak: ${esc(r.reject_reason)}</div>` : ''}${x}</div>`;
}
async function openAtt(path) { const { data, error } = await SB.storage.from('mc-attachments').createSignedUrl(path, 60); if (error) return toast(error.message); window.open(data.signedUrl, '_blank'); }
function sug(r) { const e = Math.min(r.days, Math.max(0, balOf(r.user_id, 'EL'))); return r.ltype === 'EL' ? {EL:e, AL:r.days - e} : {[r.ltype]:+r.days}; }
function hrInbox() {
  const q = S.all.rq.filter(r => r.status === 'hr' && r.user_id !== S.p.id);
  return `<h2 style="margin-top:0">Menunggu semakan (${q.length})</h2>` + (q.length ? q.map(r => { const s = sug(r);
    return wreq(r, `<div class="grid" style="grid-template-columns:repeat(4,1fr)">${Object.keys(T).map(k => `<div><label>${k} <span class="mut">(${balOf(r.user_id, k)})</span></label><input type="number" min="0" step="0.5" id="sp${r.id}${k}" value="${s[k] || 0}" oninput="chk(${r.id})"></div>`).join('')}</div><div id="sw${r.id}"></div><button class="btn" id="sb${r.id}" onclick="toBoss(${r.id})">Hantar kepada Lady Boss</button>`); }).join('') : '<div class="empty">Tiada permohonan menunggu.</div>');
}
function split(id) { const o = {}; Object.keys(T).forEach(k => { const v = +$('sp' + id + k).value || 0; if (v > 0) o[k] = v; }); return o; }
function chk(id) {
  const r = S.all.rq.find(x => x.id === id), o = split(id), s = Object.values(o).reduce((a, b) => a + b, 0); let m = '';
  Object.entries(o).forEach(([k, v]) => { if (v > balOf(r.user_id, k)) m += 'Baki ' + k + ' tidak cukup. '; });
  if (s !== +r.days) m += 'Jumlah mesti ' + r.days + ' hari (kini ' + s + ').';
  $('sw' + id).innerHTML = m ? `<div class="note e">${m}</div>` : ''; $('sb' + id).disabled = !!m;
}
async function toBoss(id) { const { error } = await SB.rpc('hr_send_to_boss', {p_id:id, p_alloc:split(id)}); if (error) return toast(error.message); toast('Dihantar kepada Lady Boss'); await load(); }
function bossView() {
  const q = S.all.rq.filter(r => r.status === 'boss'), d = S.all.rq.filter(r => r.status === 'approved' || r.status === 'rejected').slice(0, 10);
  return `<h2 style="margin-top:0">Untuk kelulusan (${q.length})</h2>` + (q.length ? q.map(r => wreq(r, `<label>Sebab (wajib jika tolak)</label><input id="rj${r.id}"><div class="row" style="justify-content:flex-start"><button class="btn" onclick="decide(${r.id},true)">Luluskan</button><button class="btn" style="background:var(--bad);color:var(--bad-i)" onclick="decide(${r.id},false)">Tolak</button></div>`)).join('') : '<div class="empty">Tiada permohonan menunggu.</div>') + '<h2>Keputusan terkini</h2>' + d.map(r => wreq(r)).join('');
}
async function decide(id, ok) { const { error } = await SB.rpc('boss_decide', {p_id:id, p_approve:ok, p_reason:$('rj' + id).value.trim() || null}); if (error) return toast(error.message); toast(ok ? 'Diluluskan' : 'Ditolak'); await load(); }
function teamView() {
  if (S.sel) return detail(S.all.pf.find(x => x.id === S.sel));
  return '<div class="mut">Tekan nama untuk butiran.</div>' + S.all.pf.filter(u => u.role !== 'boss').map(u => `<div class="card" style="cursor:pointer" onclick="S.sel='${u.id}';render()"><div class="row"><div><b>${esc(u.full_name)}</b><br><span class="mut">${esc(u.employee_id)} · ${esc(u.department || '')}</span></div><div class="mut">${Object.keys(T).map(k => k + ' ' + balOf(u.id, k)).join(' · ')}</div></div></div>`).join('');
}
function detail(u) {
  const bo = (k) => S.all.bal.find(x => x.user_id === u.id && x.ltype === k), f = (k, c, l) => `<div><label>${l}</label><input type="number" step="0.5" id="en${k}${c}" value="${(bo(k) || {})[c] || 0}"></div>`;
  const al = bo('AL');
  return `<button class="btn ghost" onclick="S.sel=null;render()">Kembali</button><h2>${esc(u.full_name)} <span class="mut">${esc(u.employee_id)}</span></h2><div class="grid">${Object.keys(T).map(k => `<div class="card bal"><span>${T[k]}</span><b>${k} ${balOf(u.id, k)}/${tot(bo(k))}</b></div>`).join('')}</div>` +
    (al ? `<div class="mut">AL: asas ${al.base} + B/F ${al.bf} + anugerah ${al.award} + ganti ${al.swap} − guna ${al.used}</div>` : '') +
    (S.p.role === 'hr' ? `<div class="card"><b>Entitlement ${today().slice(0, 4)} (HR sahaja)</b>${u.id === S.p.id ? '<div class="note w">Ini akaun anda sendiri. Perubahan ditanda dalam audit.</div>' : ''}<h2 style="margin:10px 0 0">AL</h2><div class="grid" style="grid-template-columns:repeat(4,1fr)">${f('AL', 'base', 'Asas')}${f('AL', 'bf', 'B/F (maks 10)')}${f('AL', 'award', 'Anugerah +/-')}${f('AL', 'swap', 'Ganti')}</div><div class="grid" style="grid-template-columns:repeat(3,1fr)">${['MC', 'EL', 'UP'].map(k => f(k, 'base', k + ' asas')).join('')}</div><label>Sebab (wajib)</label><input id="enr"><button class="btn" onclick="saveEnt('${u.id}')">Simpan entitlement</button></div>` : '') +
    '<h2>Sejarah</h2>' + (S.all.rq.filter(r => r.user_id === u.id).map(r => wreq(r)).join('') || '<div class="empty">Tiada rekod.</div>');
}
async function saveEnt(uid) {
  const why = $('enr').value.trim(); if (!why) return toast('Sebab wajib diisi');
  const y = +today().slice(0, 4), cs = ['base', 'bf', 'award', 'swap'];
  for (const k of Object.keys(T)) {
    const o = S.all.bal.find(x => x.user_id === uid && x.ltype === k) || {base:0, bf:0, award:0, swap:0};
    const n = {}; cs.forEach(c => n[c] = $('en' + k + c) ? +$('en' + k + c).value || 0 : 0);
    if (cs.every(c => +o[c] === n[c])) continue;
    const { error } = await SB.rpc('hr_set_entitlement', {p_user:uid, p_year:y, p_type:k, p_base:n.base, p_bf:n.bf, p_award:n.award, p_swap:n.swap, p_reason:why});
    if (error) return toast(k + ': ' + error.message);
  }
  toast('Entitlement dikemas kini'); await load();
}

/* ===== Takwim dan Audit ===== */
function mon(n) { const [y, m] = S.cm.split('-').map(Number); S.cm = new Date(Date.UTC(y, m - 1 + n, 1)).toISOString().slice(0, 7); S.day = null; render(); }
function takwimView() {
  const canEdit = S.p.role === 'hr' && S.view === 'w';
  const [y, m] = S.cm.split('-').map(Number), f = new Date(Date.UTC(y, m - 1, 1)).getUTCDay(), dn = new Date(Date.UTC(y, m, 0)).getUTCDate();
  let c = ''; for (let i = 0; i < f; i++) c += '<span></span>';
  for (let d = 1; d <= dn; d++) { const k = S.cm + '-' + String(d).padStart(2, '0'), w = isWork(k);
    c += `<button onclick="S.day='${k}';render()" style="padding:8px 0;border-radius:8px;border:${S.day === k ? '2px solid var(--acc)' : '1px solid var(--line)'};font:inherit;cursor:pointer;background:${w ? 'var(--soft)' : 'var(--bad)'};color:${w ? 'var(--acc)' : 'var(--bad-i)'}">${d}${S.cn[k] ? '*' : ''}</button>`; }
  const ov = Object.keys(S.cal).filter(k => k.startsWith(S.cm)).sort();
  return `<div class="row" style="align-items:center"><button class="btn ghost" onclick="mon(-1)">Sebelum</button><b>${String(m).padStart(2, '0')}/${y}</b><button class="btn ghost" onclick="mon(1)">Seterusnya</button></div>
  <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:10px;text-align:center" class="mut">${['Ahd', 'Isn', 'Sel', 'Rab', 'Kha', 'Jum', 'Sab'].map(x => '<span>' + x + '</span>').join('')}${c}</div>
  <div class="mut" style="margin-top:8px">Hijau = operasi, merah = tidak operasi. Lalai: Jumaat tidak operasi. Bertanda * = ada nota. ${canEdit ? 'Tekan tarikh untuk ubah.' : 'Tekan tarikh untuk lihat nota.'}</div>` +
  (S.day && !canEdit ? `<div class="card" style="margin-top:10px"><b>${fmt(S.day)}</b> <span class="mut">${isWork(S.day) ? 'operasi' : 'tidak operasi'}</span><div style="margin-top:6px">${esc(S.cn[S.day] || 'Tiada nota untuk tarikh ini.')}</div></div>` : S.day ? `<div class="card" style="margin-top:10px"><b>${fmt(S.day)}</b> <span class="mut">sekarang: ${isWork(S.day) ? 'operasi' : 'tidak operasi'}</span><label>Nota (contoh: nama cuti umum)</label><input id="tn" value="${esc(S.cn[S.day] || '')}"><div class="row" style="justify-content:flex-start;flex-wrap:wrap"><button class="btn" onclick="setDay('off')">Tidak operasi</button><button class="btn" onclick="setDay('op')">Operasi</button><button class="btn ghost" style="margin-top:10px" onclick="setDay(null)">Ikut lalai</button></div></div>` : '') +
  (canEdit ? `<div class="card"><b>Tambah julat tarikh</b><div class="mut">Untuk cuti perayaan atau kilang tutup beberapa hari sekali gus.</div><div class="grid"><div><label>Dari</label><input type="date" id="rf"></div><div><label>Hingga</label><input type="date" id="rt"></div></div><label>Status</label><select id="rs"><option value="off">Tidak operasi</option><option value="op">Operasi</option><option value="">Ikut lalai (padam pengecualian)</option></select><label>Nota</label><input id="rn" placeholder="contoh: Cuti Hari Raya Aidilfitri"><button class="btn" onclick="setRange()">Simpan julat</button></div>` : '') + '<h2>Pengecualian bulan ini</h2>' + (ov.length ? ov.map(k => `<div class="card row"><span>${fmt(k)} · ${S.cal[k] === 'op' ? 'Operasi' : 'Tidak operasi'}</span><span class="mut">${esc(S.cn[k] || '')}</span></div>`).join('') : '<div class="empty">Tiada pengecualian.</div>');
}
async function setDay(st) {
  const { data, error } = await SB.rpc('set_calendar_day', {p_day:S.day, p_status:st, p_note:$('tn').value.trim() || null});
  if (error) return toast(error.message);
  toast(data > 0 ? data + ' permohonan terjejas, semak semula' : 'Takwim dikemas kini'); await load();
}
async function setRange() {
  const f = $('rf').value, t = $('rt').value, st = $('rs').value || null, note = $('rn').value.trim() || null;
  if (!f || !t) return toast('Pilih tarikh dari dan hingga');
  if (t < f) return toast('Tarikh hingga mesti selepas tarikh dari');
  const n = Math.round((new Date(t) - new Date(f)) / 864e5) + 1;
  if (n > 63) return toast('Maksimum 63 hari sekali gus');
  if (!confirm('Tetapkan ' + n + ' hari (' + fmt(f) + ' hingga ' + fmt(t) + ') sebagai ' + (st === 'off' ? 'tidak operasi' : st === 'op' ? 'operasi' : 'ikut lalai') + '?')) return;
  const { data, error } = await SB.rpc('set_calendar_range', {p_from:f, p_to:t, p_status:st, p_note:note});
  if (error) return toast(error.message);
  S.cm = f.slice(0, 7); S.day = null;
  toast(data > 0 ? data + ' permohonan terjejas, semak semula' : 'Julat dikemas kini'); await load();
}
const ACT = {hantar_permohonan:'Hantar permohonan', hr_hantar_kepada_boss:'HR hantar kepada Lady Boss', lulus:'Lulus', tolak:'Tolak', ubah_entitlement:'Ubah entitlement', ubah_takwim:'Ubah takwim'};
function auText(a) {
  const d = a.detail || {};
  if (a.action === 'ubah_entitlement') { const o = d.sebelum || {}, n = d.selepas || {};
    return nm(d.staf) + ' · ' + d.jenis + ' ' + d.tahun + ': asas ' + (o.base ?? 0) + '→' + n.base + ', B/F ' + (o.bf ?? 0) + '→' + n.bf + ', anugerah ' + (o.award ?? 0) + '→' + n.award + ', ganti ' + (o.swap ?? 0) + '→' + n.swap + '. Sebab: ' + d.sebab + (d.akaun_sendiri ? ' [AKAUN SENDIRI]' : ''); }
  if (a.action === 'ubah_takwim') return (d.dari ? fmt(d.dari) + ' hingga ' + fmt(d.hingga) : fmt(d.tarikh)) + ' → ' + (d.status === 'op' ? 'operasi' : d.status === 'off' ? 'tidak operasi' : 'lalai') + (d.terjejas ? ' (' + d.terjejas + ' permohonan terjejas)' : '');
  if (a.action === 'hr_hantar_kepada_boss') return 'Permohonan #' + d.request + ' · ' + Object.entries(d.pecahan || {}).map(([k, v]) => v + ' ' + k).join(' + ');
  return 'Permohonan #' + d.request + (d.terus_ke_boss ? ' (terus ke Lady Boss)' : '') + (d.sebab ? '. Sebab: ' + d.sebab : '');
}
function auditView() {
  return S.all.au.length ? S.all.au.map(a => `<div class="card"><div class="row"><b>${esc(nm(a.actor))}</b><span class="mut">${new Date(a.at).toLocaleString('ms-MY', {timeZone:'Asia/Kuala_Lumpur', dateStyle:'short', timeStyle:'short'})}</span></div><span class="tag">${esc(ACT[a.action] || a.action)}</span><div class="mut" style="margin-top:6px">${esc(auText(a))}</div></div>`).join('') : '<div class="empty">Belum ada tindakan direkod.</div>';
}

function calc() {
  const t = $('ft').value, s = $('fs').value, e = $('fe').value, f = $('ff').files[0];
  const okFile = !!f && /^(application\/pdf|image\/(jpeg|png))$/.test(f.type) && f.size <= 5e6;
  $('fl').textContent = t === 'MC' ? 'Lampiran MC (wajib)' : 'Lampiran sokongan (pilihan)';
  let h = '', ok = true;
  if (!s || !e) ok = false;
  else if (e < s) { ok = false; h += '<div class="note e">Tarikh tamat mesti selepas atau sama dengan tarikh mula.</div>'; }
  else { const d = cnt(s, e); if (!d) { ok = false; h += '<div class="note e">Semua tarikh dipilih adalah hari tidak operasi.</div>'; } else h += `<div class="note o">Jumlah dikira: <b>${d} hari bekerja</b></div>`; }
  if (f && !okFile) { ok = false; h += '<div class="note e">Fail mesti PDF, JPG atau PNG, maksimum 5MB.</div>'; }
  if (t === 'MC' && !f) { ok = false; h += '<div class="note w">Lampirkan dokumen MC.</div>'; }
  if (ok && !$('fw').value.trim()) { ok = false; h += '<div class="note w">Tulis sebab ringkas.</div>'; }
  $('prev').innerHTML = h + (S.cmsg ? `<div class="note e">${esc(S.cmsg)}</div>` : ''); $('sub').disabled = !ok;
}
async function submitReq() {
  $('sub').disabled = true; S.cmsg = '';
  const f = $('ff').files[0]; let path = null;
  const fail = m => { S.cmsg = m; calc(); };
  if (f) {
    path = S.p.id + '/' + Date.now() + '-' + f.name.replace(/[^\w.\-]/g, '_');
    const u = await SB.storage.from('mc-attachments').upload(path, f);
    if (u.error) return fail('Gagal muat naik lampiran: ' + u.error.message);
  }
  const { error } = await SB.rpc('submit_leave', {p_type:$('ft').value, p_start:$('fs').value, p_end:$('fe').value, p_reason:$('fw').value.trim(), p_att:path});
  if (error) return fail(error.message);
  toast('Permohonan dihantar'); S.tab = 'h'; await load();
}

function render() { $('app').innerHTML = S.scr === 'setpw' ? setPwView() : S.scr === 'app' ? appView() : loginView(); if (S.scr === 'app' && S.tab === 'm') calc(); if (S.scr === 'app' && S.p.role === 'hr' && S.view === 'w' && S.tab === 'i') S.all.rq.filter(r => r.status === 'hr' && r.user_id !== S.p.id).forEach(r => chk(r.id)); }
</script>
